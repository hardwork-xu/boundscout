[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "boundscout"
version = "0.1.0"
description = "Inspectable exact CPU vector search with spatial block pruning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "threadpoolctl==3.6.0"]

[project.optional-dependencies]
dev = ["pip==24.0", "setuptools==80.9.0", "wheel==0.45.1", "pytest==8.3.5", "ruff==0.11.13", "mypy==1.15.0", "build==1.2.2.post1", "h5py==3.13.0", "matplotlib==3.10.3", "pip-tools==7.4.1"]

[project.scripts]
boundscout = "boundscout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: CLI, storage and benchmark integration"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/boundscout"]

[[tool.mypy.overrides]]
module = ["scipy.*", "threadpoolctl"]
ignore_missing_imports = true
